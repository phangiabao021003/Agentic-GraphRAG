[project]
name = "mcp-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "qdrant-client>=1.12",
    "pydantic-settings>=2.6",
    "langchain-community>=0.3",
    "langchain-qdrant>=0.2",
    "transformers>=4.46",
    "torch>=2.5",
    "sentence-transformers>=3.3",
    "fastembed>=0.4",
    "pymupdf>=1.24",
    "pandas>=2.2",
    "spacy>=3.8",
    "langchain-core>=0.3",
    "mcp>=1.9,<2.0",
    "python-multipart>=0.0.12",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "anyio>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
